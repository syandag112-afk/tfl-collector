name: collect
on:
  schedule:
    - cron: '*/5 * * * *'   # outer schedule (GitHub minimum); each run samples every 60 s for 5 min
  workflow_dispatch:
concurrency:
  group: collect          # one run at a time; a queued run waits instead of colliding
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: "A: trigger the app's own history collection (poll)"
        env:
          POLL_URL: ${{ vars.POLL_URL || 'https://dune-amber-rapid-zenith.grok.me/api/ea/poll' }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/poll.json -w '%{http_code}' --max-time 60 "$POLL_URL" || echo 000)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = 200 ]; then head -c 300 /tmp/poll.json; echo
              grep -q '"skipped":true' /tmp/poll.json && echo "::warning::app poll answered skipped:true (it recorded nothing) - see PERMANENT_FIXES Fix 9"
              exit 0; fi
            case "$code" in 429|5??|000) sleep $((i*i*10));; *) echo "::warning::poll returned $code"; exit 0;; esac
          done
          echo "::warning::poll failed after 3 attempts"; exit 0
      - name: Restore collector state (in-flight predictions, timetables)
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: state-${{ github.run_id }}
          restore-keys: state-
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: "B: TfL snapshot for all bus routes"
        env:
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: |
          # inner loop: one reading per minute, 5 readings per run
          for n in 1 2 3 4 5; do
            t0=$(date +%s)
            echo "reading $n at $(date -u +%T)Z"
            curl -s -o /dev/null --max-time 20 "${{ vars.POLL_URL || 'https://dune-amber-rapid-zenith.grok.me/api/ea/poll' }}" || true
            python scripts/collector.py collect || echo "::warning::reading $n failed"
            [ $n -lt 5 ] && sleep $(( 60 - ($(date +%s) - t0) > 0 ? 60 - ($(date +%s) - t0) : 0 ))
          done; true
      - name: Save collector state
        if: success()
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: state-${{ github.run_id }}
      - name: List service days in this run
        id: day
        run: |
          d=$(ls data/raw 2>/dev/null | sort | tr '\n' ' ')
          echo "days=$d" >> "$GITHUB_OUTPUT"; echo "days: $d"
      - name: Store this run's stop passages (kept 3 days, rolled up nightly)
        if: steps.day.outputs.days != ''
        uses: actions/upload-artifact@v7
        with:
          name: raw-${{ github.run_id }}   # may hold several day folders; daily.yml reads all and filters by day
          path: data/raw/
          retention-days: 3
          if-no-files-found: ignore
