name: collect
on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may start runs 5-20 min late at busy times
  workflow_dispatch:
concurrency:
  group: collect          # one run at a time; a queued run waits instead of colliding
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: "A: trigger the app's own history collection (poll)"
        env:
          POLL_URL: ${{ vars.POLL_URL || 'https://dune-amber-rapid-zenith.grok.me/api/ea/poll' }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/poll.json -w '%{http_code}' --max-time 60 "$POLL_URL" || echo 000)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = 200 ]; then head -c 300 /tmp/poll.json; echo; exit 0; fi
            case "$code" in 429|5??|000) sleep $((i*i*10));; *) echo "::error::poll returned $code"; exit 1;; esac
          done
          echo "::error::poll failed after 3 attempts"; exit 1
      - name: Restore collector state (in-flight predictions, timetables)
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: state-${{ github.run_id }}
          restore-keys: state-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "B: TfL snapshot for all bus routes"
        env:
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: python scripts/collector.py collect
      - name: Save collector state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: state-${{ github.run_id }}
      - name: Name the raw file by service day
        id: day
        run: |
          d=$(ls data/raw 2>/dev/null | sort | tail -1)
          echo "day=$d" >> "$GITHUB_OUTPUT"
      - name: Store this run's stop passages (kept 3 days, rolled up nightly)
        if: steps.day.outputs.day != ''
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ steps.day.outputs.day }}-${{ github.run_id }}
          path: data/raw/
          retention-days: 3
          if-no-files-found: ignore
